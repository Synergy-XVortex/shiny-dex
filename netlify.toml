[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every unknown path (/stats, /vitrine…) serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker and manifest must never be cached by the browser,
# otherwise app updates can take days to reach the phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets never change, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
