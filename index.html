<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Suivi personnel d'un Shiny Living Dex." />
    <meta name="theme-color" content="#f5f6f8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Shiny Dex</title>
    <script>
      // Applies the saved theme before the first paint to avoid a light flash
      // in dark mode. Keep the key and colours in sync with src/features/theme/theme.ts.
      (function () {
        var preference = 'system';
        try {
          var stored = localStorage.getItem('shinydex.theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
        } catch (error) {}
        var dark =
          preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        root.style.colorScheme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#111317' : '#f5f6f8');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
